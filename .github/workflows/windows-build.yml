name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "windows-*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (Windows x64)
        shell: bash
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          npm run fetch-node
          npm run fetch-ffmpeg
          npm run stage-screenpipe
          npm run build
          # Skip beforeBuildCommand — resources + frontend already prepared.
          npx tauri build --target x86_64-pc-windows-msvc --config '{"build":{"beforeBuildCommand":""}}'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarbas-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/jarbas.exe
          if-no-files-found: error
